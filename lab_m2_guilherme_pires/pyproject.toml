[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pdi_lab"
version = "2.2.0"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26", "opencv-python>=4.9"]

[project.scripts]
pdi_lab = "pdi_lab.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
